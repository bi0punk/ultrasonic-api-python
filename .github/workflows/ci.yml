name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [temp-humedad, distancia]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install deps (${{ matrix.app }})
        working-directory: ${{ matrix.app }}
        run: uv pip install --system -r requirements.txt ruff pytest

      - name: Ruff check
        working-directory: ${{ matrix.app }}
        run: ruff check .

      - name: Ruff format check
        working-directory: ${{ matrix.app }}
        run: ruff format --check .

  root-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv pip install --system ruff pytest
      - run: ruff check .
      - run: pytest -q
